<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#741D28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coolum">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180-apple.png">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<title>Coolum · 5–10 Oct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --blush:#FFD2D9;
  --paper:#FFFAFA;
  --shell:#FFE6EA;
  --ink:#4F141B;
  --ink-soft:#904A53;
  --rose:#FF88BE;
  --rose-deep:#741D28;
  --ochre:#F08A59;
  --ochre-soft:#FCE8DE;
  --leaf:#B9AC39;
  --hair:#EFB9C4;
  --hair-soft:#FFE2E6;
  /* the brights are too light for white text — AA-safe ink for each */
  --on-rose:#5E3246;
  --on-ochre:#54301F;
  --on-ochre-soft:#9A5839;
  --r:14px;
  --tap:44px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--blush);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2.5px solid var(--ochre);outline-offset:2px;border-radius:6px}

header{position:sticky;top:0;z-index:20;background:var(--rose-deep);color:#FFEAF0;
  padding:calc(14px + var(--safe-t)) 16px 12px;border-bottom-left-radius:20px;border-bottom-right-radius:20px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:2.45rem;letter-spacing:-.035em;line-height:.9;margin:0}
h1 span{display:block;font-size:.82rem;font-weight:500;letter-spacing:.01em;opacity:.72;margin-top:7px}
.countdown{flex:none;text-align:right;font-family:var(--display);line-height:1;padding:7px 10px;
  border:1.5px solid rgba(246,233,229,.34);border-radius:11px}
.countdown b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.countdown i{font-style:normal;font-size:.62rem;opacity:.75;letter-spacing:.06em}
.searchwrap{position:relative;margin-top:14px}
.searchwrap>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}
#q{width:100%;height:var(--tap);padding:0 38px;background:rgba(255,255,255,.12);
  border:1.5px solid rgba(246,233,229,.22);border-radius:12px;color:#fff}
#q::placeholder{color:rgba(246,233,229,.58)}
#qclear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;color:#FFEAF0;opacity:.65}

.tabs{display:flex;gap:4px;margin:12px 16px 0;background:var(--shell);padding:4px;border-radius:12px;border:1px solid var(--hair-soft)}
.tabs button{flex:1;height:38px;border-radius:9px;font-weight:600;font-size:.9rem;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{background:var(--paper);color:var(--rose-deep);box-shadow:0 1px 2px rgba(116,29,40,.12)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:1.5px solid var(--hair);
  background:var(--paper);font-size:.85rem;font-weight:600;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.chip .dot{width:7px;height:7px;border-radius:50%}

main{padding:4px 16px 0}
.group{margin-top:22px}
.group>h2{font-family:var(--display);font-size:1.02rem;font-weight:700;letter-spacing:-.01em;
  margin:0 0 2px;display:flex;align-items:baseline;gap:8px}
.group>h2 em{font-style:normal;font-size:.74rem;font-weight:500;color:var(--ink-soft);letter-spacing:0}
.group.today>h2:after{content:"today";font-size:.62rem;font-weight:700;letter-spacing:.07em;color:var(--on-ochre);
  background:var(--ochre);padding:2px 7px;border-radius:999px}
.stack{background:var(--paper);border:1px solid var(--hair-soft);border-radius:var(--r);overflow:hidden;margin-top:8px}
.row{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border-top:1px solid var(--hair-soft);width:100%;text-align:left}
.stack .row:first-child{border-top:none}
.row.is-done .title{text-decoration:line-through;color:var(--ink-soft)}
.tick{flex:none;width:23px;height:23px;margin-top:1px;border-radius:7px;border:2px solid var(--hair);
  background:var(--paper);display:flex;align-items:center;justify-content:center;color:transparent;font-size:.8rem;font-weight:800}
.row.is-done .tick{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.body{flex:1;min-width:0;text-align:left}
.title{font-weight:600;letter-spacing:-.005em;display:block}
.title .star{color:var(--ochre);margin-left:5px}
.note{font-size:.84rem;color:var(--ink-soft);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.pill{font-size:.68rem;font-weight:700;letter-spacing:.02em;padding:2.5px 8px;border-radius:999px;
  background:var(--shell);color:var(--ink-soft);border:1px solid var(--hair-soft)}
.pill.cat{background:var(--catbg);color:var(--catfg);border-color:transparent}
.pill.book{background:var(--ochre-soft);color:var(--on-ochre-soft);border-color:transparent}
.rowthumb{flex:none;align-self:center;width:54px;height:54px;border-radius:10px;
  object-fit:cover;background:var(--shell)}
.chev{flex:none;align-self:center;color:var(--hair);font-size:1.15rem}
.empty{background:var(--paper);border:1px dashed var(--hair);border-radius:var(--r);padding:26px 20px;text-align:center;margin-top:14px}
.empty p{margin:0 0 14px;color:var(--ink-soft);font-size:.92rem}

.know{margin:24px 0 0;background:var(--rose-deep);color:#FBDDE4;border-radius:var(--r);padding:16px 17px}
.know h2{font-family:var(--display);font-size:1rem;margin:0 0 9px;color:#fff}
.know ul{margin:0;padding-left:17px;font-size:.85rem;line-height:1.55}
.know li{margin-bottom:6px}
.know li:last-child{margin-bottom:0}

.fab{position:fixed;right:16px;bottom:calc(18px + var(--safe-b));z-index:30;height:54px;padding:0 21px 0 17px;
  border-radius:999px;background:var(--ochre);color:var(--on-ochre);font-weight:700;font-size:1rem;
  display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(116,29,40,.30)}
.fab b{font-size:1.35rem;font-weight:700;line-height:1}

.scrim{position:fixed;inset:0;background:rgba(79,20,27,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--blush);
  border-top-left-radius:22px;border-top-right-radius:22px;max-height:92vh;overflow-y:auto;
  padding:0 16px calc(20px + var(--safe-b));transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheettop{position:sticky;top:0;z-index:3;background:var(--blush);height:46px;
  display:flex;align-items:center;justify-content:center}
.grab{width:38px;height:4px;border-radius:4px;background:var(--hair)}
.sheetx{position:absolute;top:50%;right:0;transform:translateY(-50%);width:38px;height:38px;
  border-radius:50%;background:var(--shell);border:1px solid var(--hair-soft);color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;line-height:1}
.sheet h3{font-family:var(--display);font-size:1.4rem;margin:0 0 12px;letter-spacing:-.02em;line-height:1.15}
label{display:block;font-size:.76rem;font-weight:700;color:var(--ink-soft);margin:13px 0 5px}
.field{width:100%;min-height:var(--tap);padding:11px 13px;background:var(--paper);border:1.5px solid var(--hair);border-radius:11px}
textarea.field{min-height:76px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-width:60px;height:42px;border:1.5px solid var(--hair);background:var(--paper);
  border-radius:11px;font-size:.84rem;font-weight:600;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.starbtn{width:100%;height:46px;border:1.5px solid var(--hair);background:var(--paper);border-radius:11px;
  font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px;color:var(--ink-soft)}
.starbtn[aria-pressed="true"]{border-color:var(--ochre);background:var(--ochre-soft);color:var(--on-ochre-soft)}
.actions{display:flex;gap:9px;margin-top:20px}
.btn{flex:1;height:50px;border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.btn.primary{background:var(--rose-deep);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--hair);color:var(--ink-soft);flex:0 0 88px}
.btn.danger{color:#8E2230;border:1.5px solid #F0C2CA;background:#FFF0F3;flex:0 0 56px}
.dtl-photo{margin:0 0 14px}
.photowrap{display:block;position:relative;width:100%;padding:0}
.dtl-photo img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;
  border-radius:var(--r);background:var(--shell)}
.dtl-photo figcaption{font-size:.68rem;color:var(--ink-soft);margin-top:5px;padding:0 2px}
.photocount{position:absolute;right:9px;bottom:9px;background:rgba(79,20,27,.74);color:#fff;
  font-size:.66rem;font-weight:700;letter-spacing:.02em;padding:4px 9px;border-radius:999px}
.galsub{font-size:.8rem;color:var(--ink-soft);margin:-8px 0 15px}
.galshot{margin:0 0 16px}
.galshot img{display:block;width:100%;border-radius:var(--r);background:var(--shell)}
.galshot figcaption{font-size:.68rem;color:var(--ink-soft);margin-top:5px;padding:0 2px}
.dtl-note{background:var(--paper);border:1px solid var(--hair-soft);border-radius:var(--r);
  padding:15px 16px;font-size:.95rem;line-height:1.6;white-space:pre-wrap;margin-bottom:14px}
.wherebox{background:var(--paper);border:1px solid var(--hair-soft);border-radius:var(--r);
  padding:13px 14px;margin-bottom:12px}
.wherelab{font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.wherename{font-weight:700;margin-top:3px;line-height:1.3}
.whereaddr{font-size:.84rem;color:var(--ink-soft);margin-top:2px}
.wherepin{font-size:.68rem;color:var(--ink-soft);margin-top:4px;font-variant-numeric:tabular-nums}
.wherebtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.wherebtns a{height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.88rem;text-decoration:none}
.wherebtns a:first-child{background:var(--rose-deep);color:#fff}
.wherebtns a:last-child{background:var(--shell);color:var(--rose-deep);border:1.5px solid var(--hair)}
.linkgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:6px}
.linkgrid a,.linkgrid button{height:48px;border-radius:12px;background:var(--paper);border:1.5px solid var(--hair);
  display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:.88rem;
  text-decoration:none;color:var(--rose-deep)}
.linkgrid a.wide,.linkgrid button.wide{grid-column:1/-1}
footer{padding:28px 16px 8px;text-align:center}
footer button{font-size:.8rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translate(-50%,14px);
  background:var(--rose-deep);color:#fff;padding:11px 17px;border-radius:999px;font-size:.86rem;font-weight:600;
  z-index:60;opacity:0;pointer-events:none;transition:all .22s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Coolum<span>Mon 5 – Sat 10 October 2026</span></h1>
    <div class="countdown" id="cd"><b>–</b><i>SLEEPS</i></div>
  </div>
  <div class="searchwrap">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="2"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search everything" autocomplete="off">
    <button id="qclear" aria-label="Clear search" hidden>✕</button>
  </div>
</header>
<div class="tabs" role="tablist">
  <button role="tab" id="tab-ideas" aria-selected="true">Ideas</button>
  <button role="tab" id="tab-days" aria-selected="false">The six days</button>
</div>
<div class="chips" id="chips"></div>
<main id="main"></main>
<footer>
  <button id="export">Back up to a file</button>
  <button id="import">Restore a backup</button>
</footer>
<button class="fab" id="add"><b>+</b> Add</button>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<script>
const KEY='coolum2026';
const mem={};
const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY,false); return r?JSON.parse(r.value):null;} }catch(e){}
    try{ const v=localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return mem[KEY]||null;
  },
  async set(v){
    const s=JSON.stringify(v); mem[KEY]=v;
    try{ if(window.storage){ await window.storage.set(KEY,s,false); return; } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};
const START=new Date(2026,9,5);
const DAYS=[

  {id:'d5',label:'Friday 9',sub:'Last full day'},
  {id:'d6',label:'Saturday 10',sub:'Eumundi, then fly out'}
];
/* ---- categories ---- */
const CATS={

  wear:{label:'Clothes',          bg:'#F3E0E6',fg:'#A04763'},
  shop:{label:'Markets & browsing',bg:'#FEEAEA',fg:'#9C5658'},

  beach:{label:'Beaches',         bg:'#F7EDDE',fg:'#88632F'},
  eat:{label:'Eat & drink',       bg:'#F3E2DE',fg:'#9E4E39'},
  trip:{label:'Day trips',        bg:'#EDE5DA',fg:'#865E2B'}

/* photos per item, hero first: [src, photographer, licence].
   Full source URLs live in CREDITS.md. */
const PHOTOS={

/* ===== practical ===== */
{id:'n1',cat:'note',wherelab:'Where you land',spot:'Brisbane Airport, domestic terminal',addr:'Airport Dr, Brisbane Airport QLD 4008',pin:'-27.38565,153.11849',links:[['Brisbane Airport — terminal info','https://www.bne.com.au/']],photo:'img/n1.jpg',must:1,day:'d1',title:'Monday — Brisbane to Coolum',
 place:'Brisbane Airport',
 note:'Land 11.30am. Allow an hour for bags and the campervan paperwork, so realistically on the road by 1pm.\n\nIt is about 130km and 1hr 40 up the Bruce Highway. The Gateway Motorway is tolled — ask the hire company how they handle tolls before you drive off the lot, because most run a Linkt account and bill you later with a fee.\n\nThat puts you into Coolum around 3pm. Arrivals after 8pm are not permitted at the park, and they ask you to ring ahead if you are running early.\n\nChecked 13 Sep 2026\nHoliday park reception is open 8am–5pm daily and arrivals after 8pm are not permitted. If you are running early or late, ring the park on +61 7 5446 1474 before you turn up rather than waiting at the gate.\n\nOne thing the plan above does not account for: Monday 5 October is the last day of the Queensland school holidays — Term 4 starts Tuesday the 6th. Expect heavier northbound traffic on the Bruce Highway and a busy changeover day at the park. From Tuesday the coast empties out.\n\nChecked against your bookings — this is the real Monday.\n\nJetstar JQ562 leaves Melbourne T4 at 10:30 and lands Brisbane 11:45, at the domestic terminal.\n\nThe van is not at the airport. Cruisin are at 42 Vauxhall Street, Virginia, about 7km west of the terminal, and their own site says plainly that they do not run a transfer service. So it is a taxi or rideshare, roughly 15 minutes.\n\nPickup is booked for 12:00, which is fifteen minutes after you land. You will not make that. Ring them from the baggage carousel and say you are on your way — it is a routine call for them, not a problem.\n\nRealistically: off the plane 11.45, bags by about 12.15, at Virginia around 12.40, then paperwork and a walk-around of the van. On the road by about 1.30. Virginia to Coolum is roughly 110km and about an hour and a half, so you are at the park mid-afternoon with reception open until 5pm. Comfortable.'},
{id:'n2',cat:'note',wherelab:'Where the van goes back',spot:'Cruisin Motorhomes, Virginia',addr:'42 Vauxhall St, Virginia QLD 4014',pin:'-27.36987,153.06499',links:[['Cruisin — branches and contacts','https://www.cruisinmotorhomes.com.au/contact-us/']],must:1,day:'d6',title:'Saturday — making the 4.30pm flight',
 place:'Brisbane Airport',
 note:'Work backwards: at the airport by 2.30pm, van returned and refuelled by 2pm, Eumundi to the airport is about 1hr 45.\n\nSo: pack up Friday night, check out first thing, be at Eumundi by 8am, browse until 11, then drive straight south. Saturday is the bigger of Eumundi\u2019s two market days, so this is a good last morning rather than a compromise.\n\nFuel up at Yandina or Cooroy — the highway servos closer to Brisbane are dearer.\n\nTwo corrections from your bookings, and the first one matters.\n\nThe van is due back at 12.00 noon on Saturday, not 2pm — and at Virginia, not the airport. The plan above works backwards from a 2pm return, which would put you two hours late.\n\nSo Saturday actually runs: Eumundi opens 7.30, be there at opening, browse until about 9.45, then drive. Eumundi to Virginia is about an hour and forty. Fuel at Yandina or Cooroy on the way, as above. Van back by 12.00, then a taxi to the terminal, about fifteen minutes.\n\nWhich leaves the second thing. Your flight is JQ569 at 16:35, so that is roughly four hours sitting at Brisbane domestic with your bags.\n\nWorth a phone call before you go: ask Cruisin whether a later drop-off is possible. Plenty of depots allow it, sometimes for a small fee, and it would buy you most of the morning back. If the answer is no, at least you know to pack a book rather than discovering it on the day.'},
{id:'v1',cat:'note',must:1,day:'d1',title:'The campervan — Cruisin Sandpiper',
 place:'Cruisin Motorhomes Virginia Brisbane',
 wherelab:'Pick up and drop off',spot:'Cruisin Motorhomes, Virginia',addr:'42 Vauxhall St, Virginia QLD 4014',pin:'-27.36987,153.06499',
 links:[['Cruisin — branches and contacts','https://www.cruisinmotorhomes.com.au/contact-us/']],
 note:'Sandpiper, 2 berth. Six days at $220 a day, unlimited kilometres. A $5,000 standard liability bond at $0 a day, an outdoor camp chair and camp table included, and a $25 LPG fee.\n\nPick up: Monday 5 October, 12.00.\nDrop off: Saturday 10 October, 12.00.\nBoth at 42 Vauxhall Street, Virginia QLD 4014.\n\nCruisin do not run an airport transfer — their site says each branch is a short 5 to 20 minute drive and you make your own way there. Taxi or rideshare from the domestic terminal is about fifteen minutes.\n\nDo the Express Check In form in your confirmation email before you fly. It takes a few minutes and saves a decent chunk of counter time at the other end.\n\nThree things to sort at the counter: how they handle tolls, whether the bond sits on your card or is waived, and where the nearest LPG swap is if you run out.\n\nThe site you have at Coolum takes vehicles up to 7.5m. A 2-berth Sandpiper is well inside that, so it is not something to worry about.'},
{id:'f1',cat:'note',must:1,title:'Flights — Jetstar',
 place:'Brisbane Airport domestic terminal',
 wherelab:'Both ends',spot:'Brisbane Airport, domestic terminal',addr:'Airport Dr, Brisbane Airport QLD 4008',pin:'-27.38565,153.11849',
 links:[['Brisbane Airport — terminal info','https://www.bne.com.au/']],
 note:'Out — JQ562, Monday 5 October. Melbourne T4 10:30, into Brisbane 11:45. Airbus A320, 2h15.\n\nHome — JQ569, Saturday 10 October. Brisbane 16:35, into Melbourne T4 20:00. Airbus A321LR, 3h25.\n\nBrisbane is the domestic terminal at both ends. Melbourne is T4, which is the budget terminal at Tullamarine — a separate building from T1 and T2, so allow for the walk if anyone drops you off at the wrong one.\n\nOnline check-in opens 48 hours before each flight, in the Jetstar app.\n\nOne to keep straight: Queensland has no daylight saving. The Saturday flight leaves at 4.35pm Queensland time, which is 5.35pm at home, and lands 8pm Melbourne time. The three and a half hours on the board is real; the clock change is on top.'},
{id:'n3',cat:'note',wherelab:'Your park',spot:'Coolum Beach Holiday Park',addr:'David Low Way, Coolum Beach QLD 4573',pin:'-26.52813,153.09161',links:[['Coolum Beach Holiday Park','https://www.sunshinecoastholidayparks.com.au/holiday_parks/coolum_beach_holiday_park/']],title:'Coolum Beach Holiday Park',
 place:'Coolum Beach Holiday Park',
 url:'https://www.sunshinecoastholidayparks.com.au/holiday_parks/coolum_beach_holiday_park/',
 note:'Ten acres of beachfront with direct access to the patrolled surf beach and the surf club literally next door. The shops on Birtwill Street are a few minutes\u2019 walk.\n\nThe practical upshot: you can leave the van parked most evenings and walk to dinner. Reviews suggest asking for a site at the southern end — quieter, no road noise. Powered sites have a concrete slab.\n\nChecked 13 Sep 2026\nReception 8am–5pm daily, closed Christmas Day. Arrivals after 8pm are not permitted; ring +61 7 5446 1474 to arrange after-hours entry. Address is David Low Way, Coolum Beach.\n\nOn site: camp kitchen and BBQ, laundry, beach showers, direct beach access, a dump point, accessible amenities, a dog area, and free wi-fi. LPG and party ice are sold at reception. Powered sites do each have a concrete slab for an annex, as the note above says.\n\nCheck-in and check-out times are not published on their site — worth confirming when you book.\n\nWhat you have actually booked: a Top of Dune powered site, six nights, Monday 5 to Saturday 10 October, one adult. $558, paid in full, nothing owing.\n\nTop of Dune sites have direct beach access and are the no-dogs part of the park — which also makes them the quieter part. That settles the question of asking for a spot away from the road: you already have one.\n\nThe category takes vehicles up to 7.5m overall length, and anything longer needs a phone call. The Sandpiper is nowhere near that, so no action needed.'},
{id:'n4',cat:'note',must:1,title:'Queensland has no daylight saving',
 note:'Victoria moves to daylight saving at 2am on Sunday 4 October — the day before you fly. So all week Coolum is an hour behind Melbourne.\n\nIn practice: sunrise around 5.20am and dark by about 6pm. Mornings are long and generous, evenings end early. Plan walks and markets early, and do not expect a late sunset dinner.'},
{id:'n5',cat:'note',day:'d1',title:'Stock the van on day one',
 place:'Coolum Village Shopping Centre',
 note:'There is an IGA on the Coolum strip within walking distance, and a bigger Coles at Coolum Village Shopping Centre if you want a proper shop.\n\nWorth getting: coffee and a plunger or aeropress, breakfast things, fruit, and two or three easy dinners. Six nights of eating out alone gets old and expensive — the good version is cooking at the van most nights and going out properly two or three times.'},
{id:'n6',cat:'note',title:'Packing notes',
 note:'Walking shoes with grip for Mount Coolum — it is rock the whole way, not a path. Reef-safe sunscreen, a hat, sunglasses, thongs, a torch for the amenities block at night, and something warm for the evening.\n\nOctober averages 26–27°C by day but drops away quickly once the sun goes. A sarong or light throw doubles as a beach mat. If you are hiring an e-bike, enclosed shoes.'},

/* ===== tours ===== */
{id:'t1',cat:'tour',photo:'img/t1.jpg',book:1,title:'Whale watching from Mooloolaba',
 place:'The Wharf Mooloolaba',
 url:'https://www.viator.com/tours/Noosa-and-Sunshine-Coast/Whale-Watching-Cruise-from-Mooloolaba/d374-6691WHALE',
 note:'The humpback migration along the Sunshine Coast runs roughly June to October, so early October is the tail end of the season — still very possible, but not guaranteed.\n\nBoats leave from the jetty at The Wharf complex. The small-boat operators cap at around 20–22 passengers, which is a much better experience than the big cruisers. Weather dependent, so they confirm the evening before; most allow free cancellation up to 24 hours out.\n\nMooloolaba is 30 minutes south of Coolum. Book a couple of days ahead and keep a backup day free.\n\nChecked 13 Sep 2026\nThe season runs 1 June to 31 October, so your week is inside it but at the tail end, as the note above says.\n\nAdventure Rafting is the small-boat operator: 2 hours, maximum 20 guests, A$99 an adult, on a 12m rib. Departures at 8am, 11am and 2pm from The Wharf, 123 Parkyn Parade, marina berth 42 next to Prawn Star. Cancel more than 48 hours ahead for a full refund or an open-dated ticket good for 12 months; inside 48 hours there is no refund, though they do refund weather cancellations. Book at adventureraftingau.rezdy.com.\n\nThe Viator link on this card returns an error to anything but a real browser, so I could not confirm that particular listing is still live.'},
{id:'t2',cat:'tour',photo:'img/t2.jpg',book:1,title:'Noosa Everglades cruise',
 place:'Noosa Everglades Boreen Point',
 note:'One of only two everglade systems in the world. Boats cross Lake Cootharaba and head up the Noosa River into the Cooloola section of Great Sandy National Park, where the water is so still it mirrors the trees.\n\nHalf-day and full-day options run from Noosaville and Boreen Point, most with lunch or a platter. It is about an hour\u2019s drive from Coolum to the northern departure points, so it eats a full day.\n\nChecked 13 Sep 2026\nEverglades Eco Safaris is the exclusive guided operator, departing Habitat Noosa Eco Camp at 204 Lake Flat Road, Boreen Point.\n\nSerenity Cruise: 2pm–4.30pm, about 2.5 hours, A$99 an adult, up to 36 people. Everglades Explorer: 8.45am–1.30pm, from A$169.\n\nThe Noosa shuttle costs nothing extra — the price is the same with or without it. Pick-ups start about 12.55pm and you are back in Noosa by roughly 6.15pm, which saves the hour\'s drive each way and is the better option if you would rather not park. Reservations 07 5485 3348.'},
{id:'t3',cat:'tour',book:1,title:'Everglades kayak, southern end',
 place:'Noosa Everglades kayak tour',
 note:'The cheaper, more active alternative to the cruise — around two and a half hours paddling the southern end, looking for stingrays and birdlife. Suits a solo traveller better than a boat full of couples, and you are back by lunchtime.\n\nChecked 13 Sep 2026\nKanu Kapers is the established everglades kayak operator — half day, one, two and three day trips, guided or self-guided, launching from Boreen Point at the northern end.\n\nThey do not publish prices anywhere on their site, so you will need to ring 07 5485 3328.\n\nI could not confirm the two-and-a-half-hour southern-end paddle described above from any operator\'s own site — worth checking that detail when you ring.'},
{id:'t6',cat:'tour',book:1,title:'Hinterland day tour',
 place:'Sunshine Coast hinterland day tour',
 note:'Small-group tours cover Maleny, Montville, the Glass House Mountains lookouts and usually a distillery or cheese stop. The case for taking one rather than driving yourself: the hinterland roads are winding, the villages are all tasting-based, and you cannot do both.\n\nMost pick up from Coolum accommodation.\n\nChecked 13 Sep 2026\nJoel\'s Journeys is one operator that picks up from Coolum Beach, at about 8.40am, for roughly an eight-hour day taking in Maleny, Montville, Mary Cairncross and a two-course lunch at Secrets on the Lake. Shared tours run Wednesday to Sunday and need a minimum of three adults.\n\nTheir site blocks automated access, so I could not confirm the price or that the Coolum pick-up still stands — worth a phone call first.\n\nWednesday is your Eumundi day, so Thursday or Friday is the natural fit for this.'},
{id:'t7',cat:'tour',book:1,title:'Australia Zoo with transfers',
 place:'Australia Zoo Beerwah',
 note:'Beerwah is about an hour south. Several operators run door-to-door transfers from Coolum, which turns a long drive plus parking into a read-a-book-both-ways day.\n\nAllow the whole day. The Crocoseum show is the thing to time your arrival around.\n\nChecked 13 Sep 2026\nThe zoo is open 9am–5pm daily and adult entry is A$77. The animals start heading to bed around 4.30pm, so a late arrival wastes the ticket — this is a get-there-at-opening day.\n\nEntry includes the conservation shows through the day, the free shuttle bus around the grounds and the wildlife hospital sneak peek.\n\nI could not verify any particular door-to-door transfer operator from Coolum: the tour sites that list them all block automated access. Ring one before you count on it rather than assuming.'},
{id:'t8',cat:'tour',photo:'img/t8.jpg',book:1,title:'Noosa River sunset cruise',
 place:'Noosa River sunset cruise',
 note:'Quiet, cheap and low effort — an hour or two on the river as the light goes. Remember sunset is around 6pm Queensland time in October, so these leave earlier than you would expect.\n\nChecked 13 Sep 2026\nNoosa River & Canal Cruises: A$38 an adult, about 2.5 hours, departing Noosaville with pick-up also available from the Sofitel jetty at Noosa Heads.\n\nDeparture time moves with the sunset across the year — 3.15pm in the depths of winter out to 4.45pm in summer — so early October will sit somewhere between. They ask you to ring or text on the day for the exact time. Phone +61 414 727 765.\n\nThere is a bar on board and you are welcome to bring your own snacks.'},

/* ===== e-bikes & hire ===== */
{id:'r1',cat:'ride',wherelab:'Delivered to you',spot:'ecoTekk delivers to the holiday park',addr:'Coolum Beach Holiday Park, David Low Way, Coolum Beach',links:[['ecoTekk e-bike hire — rates and booking','https://www.ecotekk.com.au/sunshine-coast/bike-hire/']],book:1,must:1,title:'ecoTekk e-bike hire, delivered',
 place:'ecoTekk Sunshine Coast',
 url:'https://www.ecotekk.com.au/sunshine-coast/bike-hire/',
 note:'The one that suits you best: a husband-and-wife operation that delivers solar-charged e-bikes to your accommodation anywhere between Coolum and Caloundra, and collects them from the same place. No need to fit a bike in the campervan or drive anywhere to pick it up.\n\nThey do multi-day hire as well as single days, and guided tours if you want company. Their own material says the bikes have the range for a 50km round trip around Mount Coolum, which is more than you will want in a day.\n\nWorth booking before you leave — it is a small operation.\n\nChecked 13 Sep 2026\nRates: half day (4 hours) A$64, full day (8 hours) A$95, overnight A$116, two days A$136, and A$177 for three days or more. Helmets and a lock are included, pannier baskets if you want them, and chargers come with overnight and multi-day hires.\n\nDelivery is not free. It is a fixed fee that varies by suburb, and a single bike on a half-day hire carries a A$30 surcharge — so a multi-day hire is far better value than repeated single days. Book online through their site or ring 0473 635 865.\n\nThe 50km range figure above is not stated anywhere on their current hire page, so treat it as rough rather than a promise.\n\nNo pin needed for this one: they bring the bikes to the holiday park and collect them from the same spot, so you never have to get a bike into the van or drive anywhere to pick one up.\n\nRing 0473 635 865 to confirm the drop-off point with reception before the day.'},
{id:'r2',cat:'ride',wherelab:'Nearest access to the path',spot:'Beachfront path at Coolum Surf Club',addr:'1789 David Low Way, Coolum Beach',pin:'-26.53135,153.09238',links:[['Coolum Beach — Visit Sunshine Coast','https://www.visitsunshinecoast.com/coolum']],photo:'img/r2.jpg',title:'Ride the Coastal Pathway south',
 place:'Coastal Pathway Marcoola',
 note:'A dedicated path runs south from Coolum through Mount Coolum, Marcoola and Mudjimba towards Maroochydore, almost all of it flat and beachside. On an e-bike, Coolum to Mudjimba and back is an easy morning with a coffee stop at the North Shore shops.\n\nThis is the ride that makes hiring a bike worth it.\n\nYou do not have to go looking for the path. It runs along the beachfront directly in front of the surf club, two minutes from the holiday park. Turn right, heading south, and you are on it.\n\nThe route south: Coolum esplanade, then around behind Point Arkwright at -26.54670, 153.10248, then a long flat run through Yaroomba and Mount Coolum to Marcoola at about -26.59276, 153.09656. Coolum to Marcoola is roughly 7km one way, almost all of it flat, sealed and beachside.\n\nKeep going and it continues towards Mudjimba and Maroochydore. Coolum to Mudjimba and back is an easy morning on an e-bike with a coffee at the North Shore shops.\n\nIt is shared with walkers and dogs, so it is not a fast ride. The sea breeze usually comes up from the north-east after about 10am, which means the run home from the south is into it.'},
{id:'r3',cat:'ride',wherelab:'The far end of the ride',spot:'Peregian Beach village square',addr:'Kingfisher Dr, Peregian Beach',links:[['Peregian Beach — Visit Noosa','https://www.visitnoosa.com.au/peregian-beach']],title:'Ride north to Peregian',
 place:'Peregian Beach Village Square',
 note:'About 10km up the coast on David Low Way and the bike path, through the heath of the national park. Peregian village square at the other end has cafes and a handful of good shops — so it doubles as your browsing day without the van.\n\nCheck the wind direction before you go; a northerly makes the way home hard work on a normal bike, though not on an electric one.\n\nAbout 10km north of Coolum. The path runs behind the beach through the national park heath most of the way, so it is flat, quiet and sealed, with only a couple of road crossings.\n\nAt the far end: a village green ringed by cafes, a bookshop and a handful of boutiques, and the beach two minutes away. It doubles as the browsing day without taking the van anywhere.\n\nCheck the wind before you set off. A north-easterly makes the way home hard work on a normal bike, though much less so on an electric one.'},
{id:'r4',cat:'ride',wherelab:'Launch point',spot:'Cotton Tree, Maroochy River mouth',addr:'Cotton Tree Parade, Maroochydore',links:[['Maroochydore and Cotton Tree — Visit Sunshine Coast','https://www.visitsunshinecoast.com/maroochydore'],['Queensland boating and paddling rules','https://www.qld.gov.au/recreation/activities/boating-fishing']],photo:'img/r4.jpg',title:'Stand-up paddleboard, Maroochy River',
 place:'stand up paddleboard hire Maroochy River',
 note:'Flat, protected water about 20 minutes south — the fallback if the surf is too messy to swim in. Hire is usually by the hour from Cotton Tree or Chambers Island.\n\nAbout 25 minutes south. The river mouth at Cotton Tree is flat, protected and shallow, which makes it the fallback when the surf is too messy to swim in.\n\nHire is usually by the hour from operators along Cotton Tree Parade or near Chambers Island. I could not confirm a specific operator\'s current prices from their own site, so treat this as turn-up-and-look rather than something to book ahead.\n\nGo near high tide and early: the water is glassiest before the sea breeze, and the river runs hard on a falling tide near the mouth, which is not where you want to be on a first paddle.\n\nCotton Tree has toilets, showers, a park and a good run of cafes on King Street, so it works as a morning rather than just a paddle.'},
{id:'w1',cat:'wear',photo:'img/w1.jpg',title:'Hastings Street, Noosa',
 place:'Hastings Street Noosa Heads',
 note:'The polished end of the coast and the best single strip for clothes — resortwear, linen, Australian labels, swimwear, jewellery. Expensive, and it knows it.\n\nParking is the problem. Park up at the Noosa Junction end and walk down the hill, or use the free Noosa shuttle. Give it a morning, have lunch, then walk the first section of the national park track to work it off. 25 minutes from Coolum.'},
{id:'w2',cat:'wear',must:1,title:'Noosa Junction',
 place:'Noosa Junction Queensland',
 note:'Up the hill from Hastings Street on Sunshine Beach Road, and much more interesting for browsing — vintage, op shops, independent labels, records and bookshops, at a fraction of the price.\n\nThis is where locals actually shop. Easy to combine with Hastings Street in the same trip since they are a few minutes apart.'},
{id:'w3',cat:'wear',photo:'img/w3.jpg',title:'Peregian Beach village',
 place:'Peregian Beach Village Square',
 note:'A small square of boutiques, a bookshop and cafes around a village green, ten minutes north. Not a big haul, but a genuinely pleasant hour and the beach is right there.\n\nGood as the destination for an e-bike ride rather than a separate drive.'},
{id:'w4',cat:'wear',photo:'img/w4.jpg',title:'Duke Street, Sunshine Beach',
 place:'Duke Street Sunshine Beach',
 note:'A short strip above the beach on the far side of Noosa headland — a handful of well-chosen shops, then the surf club for a drink with a view. Quieter and less frantic than Hastings Street.\n\nYou can reach it on foot through the national park from Noosa if you want to earn it.'},
{id:'w5',cat:'wear',photo:'img/w5.jpg',must:1,title:'Clothing stalls at Eumundi',
 place:'Original Eumundi Markets',
 note:'The stallholders\u2019 rule is make it, bake it, sew it, grow it — so the clothing is handmade rather than imported, mostly natural fibre, linen and cotton, plus a lot of jewellery and leather.\n\nThis is your best chance at something you will not see at home. Go early, before the heat and the crowds. Bring cash as a backup even though most take cards.'},
{id:'w6',cat:'wear',title:'King Street, Cotton Tree',
 place:'King Street Cotton Tree Maroochydore',
 note:'A pocket of boutiques and cafes by the Maroochy River mouth, 20 minutes south. Smaller and more local than Noosa. Pair it with a paddle on the river or a swim at the beach there.'},
{id:'w7',cat:'wear',title:'The Coolum strip',
 place:'Birtwill Street Coolum Beach',
 note:'Your own town — Birtwill Street and Beach Road. Surf shops, swimwear, a couple of small boutiques, the bakery and the IGA. All walkable from the park, which makes it the default when you cannot be bothered driving.'},

/* ===== markets & browsing ===== */
{id:'s1',cat:'shop',photo:'img/s1.jpg',must:1,day:'d3',title:'Eumundi Markets',
 place:'Original Eumundi Markets',
 url:'https://www.visitsunshinecoast.com/guide/sunshine-coast-markets',
 note:'Australia\u2019s biggest art and craft market — 300 to 500 stalls under heritage-listed fig trees in a hinterland town 23km inland.\n\nWednesday 8am–2pm and Saturday 7am–2pm. You can do both: Wednesday the 7th as a proper day out, Saturday the 10th on the way to the airport. Saturday is the bigger day of the two.\n\nParking is paid off Napier Drive with some limited free parking on Memorial Drive. Go early — by 11am on a Wednesday it is shoulder to shoulder.\n\nChecked 13 Sep 2026\nThe market\'s own site now lists both days as 7.30am–2pm, not 8am on the Wednesday as above. Address is 80 Memorial Drive, Eumundi.\n\nStall numbers, entry cost and parking are no longer stated anywhere on their site, so treat the parking detail above as unconfirmed.'},
{id:'s2',cat:'shop',photo:'img/s2.jpg',day:'d4',title:'Nambour Town Square Market',
 place:'Nambour Town Square',
 note:'Thursday 8am–2pm, about 25 minutes inland. Small, local and unpolished — organic food, crafts and produce rather than tourist wares.\n\nThe only other weekday market on while you are here, so it is this or nothing on a Thursday. Half an hour is enough, then Nambour itself has a slightly faded main street worth a wander.'},
{id:'s3',cat:'shop',photo:'img/s3.jpg',day:'d6',title:'Yandina Markets',
 place:'Yandina Markets North Street Yandina',
 note:'Saturday only, from 6am. Vintage and retro fashion, pre-loved goods, trash and treasure, plants and produce — a completely different character to Eumundi.\n\nYandina is right on the highway between Eumundi and the airport, so on Saturday you could do both if you start early enough.'},
{id:'s4',cat:'shop',photo:'img/s4.jpg',title:'Montville',
 place:'Main Street Montville',
 note:'A hinterland village on the escarpment about an hour and ten from Coolum, built almost entirely around browsing — galleries, woodwork, glassblowing, leather, fudge and clocks. Unashamedly touristy but the craft quality is high.\n\nThe drive up through the ranges is half the point. Combine with Maleny rather than doing either alone.'},
{id:'s5',cat:'shop',photo:'img/s5.jpg',title:'Maleny',
 place:'Maple Street Maleny',
 note:'Twenty minutes past Montville and considerably less twee. Maple Street has Rosetta Books (one of the best independent bookshops in Queensland), galleries, the Maleny Cheese factory and a good bakery.\n\nMary Cairncross Scenic Reserve is a few minutes away, with the classic view across to the Glass House Mountains and an easy rainforest loop.'},
{id:'s6',cat:'shop',title:'Noosa Regional Gallery',
 place:'Noosa Regional Gallery Tewantin',
 note:'A small public gallery on the riverside at Tewantin with changing exhibitions of regional and national work. Free entry. Usually closed Mondays — worth checking the current show before driving over.\n\nQuiet, air-conditioned, and a good hour if the weather turns.'},
{id:'s7',cat:'shop',photo:'img/s7.jpg',title:'Butter Factory Arts Centre, Cooroy',
 place:'Butter Factory Arts Centre Cooroy',
 note:'A community gallery in a converted butter factory, half an hour inland. Local artists, often ceramics and printmaking, sometimes workshops.\n\nCooroy is five minutes from Eumundi, so it slots neatly onto the end of a Wednesday market morning.'},
{id:'s8',cat:'shop',photo:'img/s8.jpg',title:'Sunshine Plaza',
 place:'Sunshine Plaza Maroochydore',
 note:'The full-size shopping centre at Maroochydore, 20 minutes south. Not the reason you came, but it is the wet-day backup and the place to replace anything you forgot to pack.'},

/* ===== walks ===== */
{id:'k1',cat:'walk',wherelab:'Start of the track',spot:'Tanah Street West car park',addr:'Tanah St West at Jarnahill Dr, Mount Coolum',pin:'-26.56195,153.09104',links:[['Mount Coolum National Park — Queensland Parks','https://parks.qld.gov.au/parks/mount-coolum'],['Track detail and grading','https://parks.qld.gov.au/parks/mount-coolum/about'],['Safety and closures','https://parks.qld.gov.au/parks/mount-coolum/visiting-safely']],photo:'img/k1.jpg',must:1,title:'Mount Coolum summit',
 place:'Mount Coolum National Park',
 note:'The one everybody does, and rightly. About 1.6km return but steep and rocky the entire way — a scramble in places rather than a path. Allow 45 to 60 minutes up, less down.\n\nThe reward is 360 degrees from Noosa in the north to Mooloolaba in the south, with the Glass House Mountains inland. There is no shade at all, so go at first light — sunrise is around 5.20am and the car park fills by 7.\n\nProper shoes, water, and take your time on the descent; that is where people come unstuck.\n\nGetting there: turn off David Low Way into Tanah Street West — 6km south of Coolum Beach, 3km north of Marcoola. The car park is at the Jarnahill Drive junction, about 10 minutes from the holiday park. It fills by 7am on a fine morning; there is no overflow, so people end up on the verge.\n\nThe track: 1.6km return, graded 4, which Queensland Parks describe as suitable for fit walkers only. The summit is 208m. Much of the climb is on the volcano\'s own hexagonal rock columns lying sideways across the path, so it is rock steps rather than a graded path. Parks advise walking it in fine weather only — the rock turns genuinely slippery wet, and that is where people get hurt on the way down.\n\nAt the top: views south to Point Cartwright and the Glass House Mountains, west to the Blackall Range, north to Noosa Heads. No shade anywhere on the climb or at the summit.\n\nTake more water than feels necessary, wear shoes with grip, and go at first light. There are toilets at the trailhead.'},
{id:'k2',cat:'walk',wherelab:'Start of the boardwalk',spot:'Point Perry lookout',addr:'David Low Way, Coolum Beach',pin:'-26.53591,153.09590',links:[['Coolum Beach — Visit Sunshine Coast','https://www.visitsunshinecoast.com/coolum']],must:1,title:'Coolum boardwalk and Point Perry',
 place:'Point Perry Lookout Coolum Beach',
 note:'Flat, easy and five minutes from your van. The boardwalk runs south along the dark volcanic rock of the headland to the Point Perry lookout.\n\nThis is the sunrise walk — east-facing, so the sun comes straight up out of the water. Also the best place in town to sit with a coffee and watch the surf without committing to anything.\n\nFrom the holiday park, walk south along the esplanade and the boardwalk picks up at the end of the built-up strip. Point Perry is the far end, on the dark volcanic rock.\n\nLow\'s Lookout sits partway along at -26.53526, 153.09076 if you want a shorter target. The whole thing is flat, sealed and lit in parts, so it works before dawn.\n\nEast-facing, so the sun comes up out of the water. In early October that is around 5.20am Queensland time. Allow 20 minutes each way at a stroll from the park.'},
{id:'k3',cat:'walk',wherelab:'Park entrance',spot:'Noosa National Park day use area, end of Park Road',addr:'Park Rd, Noosa Heads',pin:'-26.38534,153.09430',links:[['Noosa National Park — Queensland Parks','https://parks.qld.gov.au/parks/noosa'],['Track notes and grading','https://parks.qld.gov.au/parks/noosa/about'],['Safety and closures','https://parks.qld.gov.au/parks/noosa/visiting-safely']],photo:'img/k3.jpg',must:1,title:'Noosa National Park coastal track',
 place:'Noosa National Park Noosa Heads',
 note:'The best coastal walk on this stretch of the country. From the Noosa Heads entrance the track runs past Boiling Pot, Tea Tree Bay, Dolphin Point and Granite Bay to Hells Gates — about 5.4km return to Hells Gates, mostly easy, with a few rocky bits.\n\nKoalas are often in the trees around Tea Tree Bay; look for clusters of people staring upward. Alexandria Bay, further on, is clothing-optional and usually empty.\n\nParking at the entrance is a nightmare after 8am — park in Noosa and walk in, or take the shuttle.\n\nParking: the day use area at the end of Park Road is full by about 8am and stays full. The reliable alternative is the Noosa Junction park and ride at -26.39932, 153.09249, then the shuttle or a 20 minute walk down.\n\nThe track in order, so you know how far you have come: First Point at the start, Boiling Pot at -26.37944, 153.10102, Tea Tree Bay, Dolphin Point at -26.37743, 153.10821, Granite Bay, then Hell\'s Gates at -26.37921, 153.11946. About 5.4km return to Hell\'s Gates, mostly easy and sealed as far as Tea Tree Bay, rockier after that.\n\nKoalas are usually in the trees between Tea Tree Bay and Dolphin Point. Look for the cluster of people staring upwards rather than looking yourself.\n\nToilets and water at the day use area, nothing after that. No shade on the Hell\'s Gates section.\n\nQueensland Parks are explicit that the beaches around Noosa National Park are not patrolled and swimming there is not recommended. That applies to Alexandria Bay and the little bays along the track — worth knowing before you swim alone. Walk in daylight only, and carry water, a phone and a hat.'},
{id:'k4',cat:'walk',wherelab:'Lookout car park',spot:'Point Arkwright lookout',addr:'Jubilee Esplanade, Point Arkwright',pin:'-26.54670,153.10248',links:[['Coolum and Yaroomba — Visit Sunshine Coast','https://www.visitsunshinecoast.com/coolum']],photo:'img/k4.jpg',title:'Point Arkwright and Yaroomba',
 place:'Point Arkwright Lookout',
 note:'Five minutes south of Coolum. A short walk out to a headland lookout that is one of the better land-based whale-watching spots on the coast during the migration — bring binoculars and give it twenty patient minutes.\n\nYou can continue along the beach south to Yaroomba and back.\n\nFive minutes south of Coolum on David Low Way, then into Jubilee Esplanade. Small car park right at the headland, so it is a two minute walk rather than a hike.\n\nOne of the better land-based whale spots on this coast during the migration, which runs to the end of October. Give it twenty patient minutes and take binoculars — from the headland you are looking down into the water rather than across it.\n\nFrom here you can drop to the beach and walk south to Yaroomba. No facilities at the lookout itself.'},
{id:'k5',cat:'walk',wherelab:'Northern access',spot:'Stumers Creek car park',addr:'Stumers Creek Rd, off David Low Way, Coolum Beach',links:[['Coolum Beach — Visit Sunshine Coast','https://www.visitsunshinecoast.com/coolum']],title:'Stumers Creek to Marcoola',
 place:'Stumers Creek Coolum Beach',
 note:'North end of Coolum, where the creek meets the sea. A long flat beach walk with barely anyone on it, and an off-leash dog area if you want to say hello to other people\u2019s dogs.\n\nThe creek itself is worth the walk — it shifts with every tide and the light on it in the late afternoon is lovely.\n\nThe northern end of Coolum, about 2km up David Low Way from the holiday park, then in on Stumers Creek Road. There is a gravel car park at the end.\n\nThe creek mouth shifts with every tide, so the walk is never quite the same. Head north along the sand and you can keep going to Marcoola. Almost nobody is up here on a weekday morning.\n\nThis is an off-leash dog area, which is the main reason locals come. Unpatrolled, so it is for walking and wading rather than swimming.\n\nI could not verify an exact pin for the car park from an authoritative source, so this one is the street rather than a precise point — it is signposted off David Low Way.'},
{id:'k6',cat:'walk',wherelab:'Reserve entrance',spot:'Mary Cairncross Scenic Reserve',addr:'148 Mountain View Rd, Maleny QLD 4552',links:[['Mary Cairncross Scenic Reserve — Sunshine Coast Council','https://mary-cairncross.sunshinecoast.qld.gov.au/']],photo:'img/k6.jpg',title:'Mary Cairncross Scenic Reserve',
 place:'Mary Cairncross Scenic Reserve Maleny',
 note:'Fifty-five hectares of remnant subtropical rainforest near Maleny with a gentle 1.7km loop, plus a lookout lawn with the postcard view of the Glass House Mountains.\n\nSmall entry fee for the walk. Pair with Maleny\u2019s main street and you have a full hinterland day.\n\nWalking tracks are open 7am to 6pm. The Rainforest Discovery Centre opens 9am to 5pm. Entry to the walk is a gold coin donation. Phone 07 5494 2826.\n\nThe loop is about 2km, flat and sealed enough for a pram or a wheelchair — the council describe it as an easy walk, so it is a gentle hour rather than a hike. It protects a remnant of the Gondwana rainforest that once covered the whole Blackall Range.\n\nThe lookout lawn outside the centre has the postcard view across to the Glass House Mountains, and you do not have to pay or walk anywhere to see it. There is a cafe on site.\n\nAbout an hour and ten from Coolum. Pair it with Maleny\'s main street, five minutes away.'},
{id:'k7',cat:'walk',wherelab:'Car park',spot:'Kondalilla Falls day use area',addr:'Kondalilla Falls Rd, off Flaxton Dr, Flaxton',links:[['Kondalilla National Park — Queensland Parks','https://parks.qld.gov.au/parks/kondalilla'],['Track notes and grading','https://parks.qld.gov.au/parks/kondalilla/about'],['Safety and closures','https://parks.qld.gov.au/parks/kondalilla/visiting-safely']],photo:'img/k7.jpg',title:'Kondalilla Falls',
 place:'Kondalilla Falls National Park',
 note:'Near Montville. The full circuit is 4.7km through rainforest and down to the base of a 90m waterfall, with a swimming hole at the top. It is steep coming back up — that is the whole difficulty of it.\n\nAbout an hour and fifteen from Coolum, so treat it as the anchor of a hinterland day rather than an add-on.\n\nSignposted off Flaxton Drive between Montville and Mapleton, about an hour and fifteen from Coolum. There is a day use area with toilets, picnic tables and a car park; a parking fee applies at this park, so have a card.\n\nThe full circuit is 4.7km through rainforest to the base of the 90m falls. The rock pool at the top is a shorter walk in. All of the difficulty is on the way back — it is a long climb out of the gorge, and the steps are uneven.\n\nSwimming is at the top pool rather than the base. Check the Queensland Parks page before you drive up: this park closes after heavy rain and during fire risk, and it is a long way to go to find a gate shut.\n\nI could not verify an exact pin for the car park from an authoritative source, so this one is the road rather than a precise point.\n\nTwo things Queensland Parks say plainly about this park. There is no drinking water available, so carry your own. And people have died or been permanently paralysed slipping over the falls, so stay behind the fences and on the track — the rock at the top is polished and wet.\n\nTracks close during severe wet weather. Do not enter if closure signs are up.'},

/* ===== beaches ===== */
{id:'b1',cat:'beach',wherelab:'Patrolled flags',spot:'Coolum Beach Surf Life Saving Club',addr:'1789 David Low Way, Coolum Beach',pin:'-26.53135,153.09238',links:[['Coolum Beach SLSC','https://www.coolumsurfclub.com.au/'],['Beach and surf conditions — Beachsafe','https://beachsafe.org.au/']],photo:'img/b1.jpg',title:'Coolum main beach',
 place:'Coolum Beach Surf Life Saving Club',
 note:'Patrolled in front of the surf club, which is next door to the park. Swim between the flags — there are rips here, and on a solo trip that matters more than usual.\n\nThe October water is around 22–23°C, warm enough without a wetsuit for most people.\n\nThe club is directly next door to the holiday park, so this is your default swim — two minutes on foot.\n\nSwim between the flags. Coolum has permanent rips against the rock at both ends of the beach, and on a solo trip that matters more than it would otherwise: if you get into trouble there is nobody with you who knows you went in. Tell someone, or go when the flags are up.\n\nPatrol hours vary by season and are usually posted on the club\'s board at the top of the ramp — worth a glance on the way past rather than assuming.\n\nWater in early October is around 22-23C, warm enough without a wetsuit for most people. The club has showers, toilets and a kiosk.'},
{id:'b2',cat:'beach',wherelab:'Northern access',spot:'Stumers Creek car park',addr:'Stumers Creek Rd, off David Low Way, Coolum Beach',links:[['Coolum Beach — Visit Sunshine Coast','https://www.visitsunshinecoast.com/coolum']],title:'Stumers Creek beach',
 place:'Stumers Creek Coolum Beach',
 note:'The quiet end. Unpatrolled, so it is for walking and wading rather than swimming, but you will often have it to yourself.\n\nUnpatrolled and no facilities, so bring water and do not plan on swimming properly — the creek mouth and the bar shift constantly and there is no one watching.\n\nWhat it is good for is having a stretch of sand to yourself, wading in the creek at low tide, and the light in the late afternoon. Off-leash dog area, so expect company of the four-legged kind.\n\nAbout 2km north of the holiday park; easy on a bike along the beachfront.'},
{id:'b3',cat:'beach',wherelab:'Patrolled flags',spot:'Peregian Beach Surf Life Saving Club',addr:'Kingfisher Dr, Peregian Beach',pin:'-26.48098,153.09712',links:[['Peregian Beach SLSC','https://www.peregianbeachslsc.com.au/'],['Peregian Beach — Visit Noosa','https://www.visitnoosa.com.au/peregian-beach']],photo:'img/b3.jpg',title:'Peregian Beach',
 place:'Peregian Beach Queensland',
 note:'Ten minutes north. A long, open, low-key stretch backed by national park heath, with the village a two-minute walk from the sand. Patrolled near the surf club.\n\nTen minutes north on David Low Way, or a flat 10km ride up the coastal path. Patrolled in front of the club; the rest of the beach runs for kilometres backed by national park heath with nobody on it.\n\nThe village is a two minute walk from the sand — a square of shops, a bookshop and cafes around a green — which makes this the easiest combination of a swim and a decent coffee on the whole coast.\n\nParking is free and usually available on Kingfisher Drive, unlike anywhere in Noosa.'},
{id:'b4',cat:'beach',wherelab:'Patrolled flags',spot:'Sunshine Beach Surf Life Saving Club',addr:'Belmore Tce at Duke St, Sunshine Beach',links:[['Sunshine Beach SLSC','https://www.sunshinebeachslsc.com.au/'],['Beach and surf conditions — Beachsafe','https://beachsafe.org.au/']],photo:'img/b4.jpg',title:'Sunshine Beach',
 place:'Sunshine Beach Queensland',
 note:'The quieter side of Noosa, with better surf than Noosa Main and a proper beach feel. Patrolled. The surf club sits up on the hill with a view worth timing for late afternoon.\n\nThe ocean side of the Noosa headland, about 30 minutes from Coolum. Bigger, cleaner surf than Noosa Main and a proper beach feel, and far fewer people than Hastings Street.\n\nThe surf club sits up on the hill with the view, which makes it the best late-afternoon drink on this stretch. Duke Street above it has a short run of good shops and cafes.\n\nPatrolled in front of the club. It is a more serious beach than Noosa Main — the shorebreak can dump — so stay between the flags.\n\nYou can walk here through Noosa National Park from the Noosa Heads end if you would rather earn it, about 3km one way.'},
{id:'b5',cat:'beach',wherelab:'Patrolled flags',spot:'Noosa Heads SLSC, Noosa Main Beach',addr:'69 Hastings St, Noosa Heads',pin:'-26.38667,153.09146',links:[['Noosa Heads SLSC','https://www.noosasurfclub.com.au/'],['Beach and surf conditions — Beachsafe','https://beachsafe.org.au/']],photo:'img/b5.jpg',title:'Noosa Main Beach',
 place:'Noosa Main Beach',
 note:'One of the very few north-facing beaches on the east coast, which is why it is so calm — genuinely a swimming beach rather than a surf beach. Busy, but the water is glassy and the longboarders at First Point are worth watching.\n\nOne of very few north-facing beaches on the east coast, which is exactly why it is so calm — this is a swimming beach rather than a surf beach, and the water is often glassy when everywhere else is a mess.\n\nThe pin is the surf club car park off Hastings Street. It is the hardest parking in Noosa; if it is full, use the Noosa Junction park and ride at -26.39932, 153.09249 and take the shuttle.\n\nLongboarders work First Point at the eastern end, at -26.38534, 153.09430, and watching them from the sand is half the appeal.\n\nHastings Street is right behind the beach, so this is the swim that comes with lunch.'},

/* ===== eat & drink ===== */
{id:'e1',cat:'eat',must:1,title:'Coolum Beach Surf Club',
 place:'Coolum Beach Surf Club',
 note:'Right next door to the park. Casual, cheap, an unbeatable view over the beach, and the single easiest place to eat alone without thinking about it — you sign in, order at the counter, and nobody looks twice.\n\nGo about an hour before sunset and take the outside tables.'},
{id:'e2',cat:'eat',title:'Canteen Kitchen + Bar',
 place:'Canteen Kitchen Bar Coolum Beach',
 url:'https://www.tripadvisor.com.au/Restaurants-g257475-Coolum_Beach_Sunshine_Coast_Queensland.html',
 note:'Consistently well reviewed in Coolum for breakfast and coffee, and it does dinner too. Walkable from the park.\n\nFair warning from reviewers: eat outside and the birds will take an interest in your plate.\n\nChecked 13 Sep 2026\nWednesday to Sunday, 7am till late — closed Monday and Tuesday, so it is not an option on your first two nights. 1748 David Low Way, which is the beach road rather than the Birtwill Street strip. Bookings online or on 07 5471 7477.\n\nThe link on this card goes to a TripAdvisor list of every Coolum restaurant rather than to Canteen, and TripAdvisor blocks automated access, so nothing could be verified through it. The venue\'s own site is canteenkitchenbar.com.'},
{id:'e3',cat:'eat',title:"Curly's on the Boardwalk",
 place:"Curly's on the Boardwalk Coolum Beach",
 note:'On the Coolum boardwalk, so you get the water view without driving anywhere. Good for a long breakfast after the Point Perry walk.'},
{id:'e4',cat:'eat',title:'Compound Surf & Espresso',
 place:'Compound Surf Espresso Coolum Beach',
 note:'Small surf-style espresso bar. The kind of place for a coffee and a pastry standing up, rather than a sit-down meal.'},
{id:'e5',cat:'eat',title:'New Earth Cafe',
 place:'New Earth Cafe Coolum Beach',
 note:'Fresh juices and breakfast, with a reputation for handling dietary requirements without fuss. Good for the morning after a long drive.'},
{id:'e6',cat:'eat',title:'Fish and chips at Tickle Park',
 place:'Tickle Park Coolum Beach',
 note:'Takeaway from the strip, eaten on the grass under the pandanus with the beach in front of you. Cheapest good dinner in town and, on a solo trip, easily the most pleasant.\n\nGet there before the light goes at 6.'},
{id:'e7',cat:'eat',title:'Eating alone, tactically',
 note:'Two things make solo dinners painless. First, sit at the bar or the pass rather than taking a table — you get served faster and there is someone to talk to if you want it. Second, go early; 6pm is quiet and by 7.30 every room is couples and families.\n\nSurf clubs, counter-order places and markets are the path of least resistance. Save the one proper sit-down dinner for a night you actively feel like it.'},

/* ===== day trips ===== */
{id:'p1',cat:'trip',photo:'img/p1.jpg',title:'Noosa',
 place:'Noosa Heads Queensland',
 note:'Twenty-five minutes north and the obvious big day out: Hastings Street for shops, Main Beach for a calm swim, the national park coastal walk, Noosa Junction for the better browsing, and Sunshine Beach on the far side.\n\nRealistically two separate days if you want to do it properly. Parking is the only real difficulty — go early or use the shuttle.'},
{id:'p2',cat:'trip',photo:'img/p2.jpg',title:'Mooloolaba',
 place:'Mooloolaba Esplanade',
 note:'Thirty minutes south. The Esplanade, a patrolled beach, the walk out to the Spit, SEA LIFE aquarium, and The Wharf where the whale-watching boats leave from.\n\nMore built up than Coolum and busier, but the beach is genuinely good and it pairs with a whale trip.'},
{id:'p3',cat:'trip',photo:'img/p3.jpg',title:'The hinterland loop',
 place:'Montville Queensland',
 note:'Montville, Maleny, Mary Cairncross and possibly Kondalilla Falls, with the Glass House Mountains on the horizon the whole time. About an hour and ten each way, on winding roads.\n\nA full day, and a complete change of scene from the coast — rainforest, cool air, and views inland. Do it on a day the beach weather is poor.'},
{id:'p4',cat:'trip',title:'Australia Zoo',
 place:'Australia Zoo Beerwah',
 note:'An hour south at Beerwah. A full day and not cheap, but it is genuinely well run and the conservation work is real. Transfers from Coolum exist if you would rather not drive.'},
{id:'p5',cat:'trip',photo:'img/p5.jpg',title:'The Ginger Factory, Yandina',
 place:'The Ginger Factory Yandina',
 note:'Twenty minutes inland. Unapologetically a tourist attraction — train ride, factory tour, ginger everything — but the shop is good for presents and it is five minutes from Eumundi, so it fits onto a market morning.'}
];

/* ============ state ============ */
let S={items:[],seedV:0};
let view='ideas', cat='all', query='';
const el=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Installed as a standalone app, iOS needs target="_blank" to open a link in
   its dismissible in-app overlay (swipe down or Done, back to the app
   underneath). A plain same-window link does the opposite of what you'd
   expect: it hijacks the app's own window with no chrome at all, and there
   is no way back except closing the app in the switcher and relaunching. */
const LT='target="_blank" rel="noopener"';
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const save=()=>store.set(S);
function toast(msg){const t=el('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}

async function boot(){
  const saved=await store.get();
  if(saved&&Array.isArray(saved.items)){
    S=saved;
    if((S.seedV||0)<SEED_V){
      // refresh seeded content, keep your ticks, day choices and stars
      const keep={};
      S.items.forEach(i=>{if(!i.id.startsWith('u'))keep[i.id]={done:i.done,day:i.day,must:i.must};});
      const mine=S.items.filter(i=>i.id.startsWith('u'));
      S.items=SEED.map(s=>{
        const k=keep[s.id];
        return k?{...s,done:k.done,day:k.day===undefined?s.day:k.day,must:k.must}:{...s};
      }).concat(mine);
      S.seedV=SEED_V; save();
    }
  }else{
    S={items:SEED.map(s=>({...s})),seedV:SEED_V}; save();
  }
  countdown(); renderChips(); render();
}
function countdown(){
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((START-today)/864e5);
  const b=el('#cd').querySelector('b'), i=el('#cd').querySelector('i');
  if(diff>0){b.textContent=diff;i.textContent=diff===1?'SLEEP':'SLEEPS';}
  else if(diff>-6){b.textContent='Day '+(1-diff);i.textContent='OF 6';}
  else{b.textContent='✓';i.textContent='HOME';}
}
function todayId(){
  const t=new Date();t.setHours(0,0,0,0);
  const n=Math.round((t-START)/864e5);
  return (n>=0&&n<6)?DAYS[n].id:null;
}
function renderChips(){
  const counts={};
  S.items.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
  const must=S.items.filter(i=>i.must).length;
  const book=S.items.filter(i=>i.book).length;
  let h=`<button class="chip" data-c="all" aria-pressed="${cat==='all'}">Everything ${S.items.length}</button>`;
  h+=`<button class="chip" data-c="must" aria-pressed="${cat==='must'}">★ Must do ${must}</button>`;
  if(book)h+=`<button class="chip" data-c="book" aria-pressed="${cat==='book'}">Book ahead ${book}</button>`;
  ORDER.forEach(k=>{ if(!counts[k])return;
    h+=`<button class="chip" data-c="${k}" aria-pressed="${cat===k}"><span class="dot" style="background:${CATS[k].fg}"></span>${CATS[k].label} ${counts[k]}</button>`;
  });
  el('#chips').innerHTML=h;
}
function filtered(){
  return S.items.filter(i=>{
    if(cat==='must'&&!i.must)return false;
    if(cat==='book'&&!i.book)return false;
    if(cat!=='all'&&cat!=='must'&&cat!=='book'&&i.cat!==cat)return false;
    if(query){const t=(i.title+' '+(i.note||'')+' '+(i.place||'')).toLowerCase();if(!t.includes(query))return false;}
    return true;
  });
}
function rowHTML(i){
  const c=CATS[i.cat]||CATS.note;
  return `<div class="row ${i.done?'is-done':''}" data-id="${i.id}">
    <button class="tick" data-tick="${i.id}" aria-label="Mark done">✓</button>
    <button class="body" data-open="${i.id}">
      <span class="title">${esc(i.title)}${i.must?'<span class="star">★</span>':''}</span>
      ${i.note?`<span class="note">${esc(i.note.split('\n')[0])}</span>`:''}
      <span class="meta">
        <span class="pill cat" style="--catbg:${c.bg};--catfg:${c.fg}">${c.label}</span>
        ${i.book?'<span class="pill book">book ahead</span>':''}
        ${i.day&&view==='ideas'?`<span class="pill">${DAYS.find(d=>d.id===i.day).label}</span>`:''}
      </span>
    </button>
    ${i.photo?`<img class="rowthumb" src="img/t/${i.id}.jpg" alt="" loading="lazy" decoding="async" data-open="${i.id}">`:''}
    <span class="chev">›</span>
  </div>`;
}
function render(){
  const list=filtered(), m=el('#main'); let h='';
  if(view==='ideas'){
    if(!list.length){
      h=`<div class="empty"><p>${query?'Nothing matches that.':'Nothing here yet.'}</p><button class="btn primary" data-open="new" style="max-width:200px;margin:0 auto">Add an idea</button></div>`;
    }else{
      ORDER.forEach(k=>{
        const g=list.filter(i=>i.cat===k); if(!g.length)return;
        g.sort((a,b)=>(b.must?1:0)-(a.must?1:0)||(a.done?1:0)-(b.done?1:0));
        h+=`<section class="group"><h2>${CATS[k].label} <em>${g.length}</em></h2><div class="stack">${g.map(rowHTML).join('')}</div></section>`;
      });
    }
    h+=knowHTML();
  }else{
    const tid=todayId();
    DAYS.forEach(d=>{
      const g=list.filter(i=>i.day===d.id);
      h+=`<section class="group ${tid===d.id?'today':''}"><h2>${d.label}${d.sub?` <em>${d.sub}</em>`:''}</h2>`;
      h+= g.length?`<div class="stack">${g.map(rowHTML).join('')}</div>`
                  :`<div class="empty" style="padding:16px"><p style="margin:0">Nothing planned. Open any idea and give it a day.</p></div>`;
      h+=`</section>`;
    });
    const un=list.filter(i=>!i.day&&i.cat!=='note');
    if(un.length)h+=`<section class="group"><h2>Not scheduled <em>${un.length}</em></h2><div class="stack">${un.map(rowHTML).join('')}</div></section>`;
  }
  m.innerHTML=h;
}
function knowHTML(){
  if(cat!=='all'||query)return '';
  return `<div class="know"><h2>Getting your bearings</h2><ul>
    <li>Coolum sits between Maroochydore and Noosa — Noosa 25 min north, Mooloolaba 30 min south, Eumundi 25 min inland, Brisbane airport 1hr 40 south.</li>
    <li>The holiday park is beachfront with the surf club next door, so town, food and the beach are all on foot. Save the van for day trips.</li>
    <li>Early October is shoulder season: warm, not yet humid, school holidays over, and the last of the whale migration still going.</li>
  </ul></div>`;
}
function openSheet(html){
  const s=el('#sheet');
  s.innerHTML='<div class="sheettop"><div class="grab"></div><button class="sheetx" aria-label="Close">✕</button></div>'+html;
  s.classList.add('open');el('#scrim').classList.add('open');s.scrollTop=0;
  s.querySelector('.sheetx').onclick=closeSheet;
}
function closeSheet(){el('#sheet').classList.remove('open');el('#scrim').classList.remove('open');}

function detail(id){
  const i=S.items.find(x=>x.id===id); if(!i)return;
  const c=CATS[i.cat]||CATS.note;
  const term=i.place||i.title;
  // an exact pin when we have verified coordinates, the street address otherwise
  const dest=i.pin||i.addr||term;
  const maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`;
  const dirs=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}`;
  const where=(i.spot||i.addr||i.pin)?`<div class="wherebox">
      <div class="wherelab">${esc(i.wherelab||'Where to go')}</div>
      <div class="wherename">${esc(i.spot||i.addr)}</div>
      ${i.addr&&i.spot?`<div class="whereaddr">${esc(i.addr)}</div>`:''}
      ${i.pin?`<div class="wherepin">Exact pin · ${esc(i.pin)}</div>`:''}
      <div class="wherebtns">
        <a href="${dirs}" ${LT}>Directions</a>
        <a href="${maps}" ${LT}>Show on map</a>
      </div>
    </div>`:'';
  const links=(i.links||[]).map(l=>
    `<a class="wide" href="${esc(l[1])}" ${LT}>${esc(l[0])}</a>`).join('');
  const ph=PHOTOS[i.id]||[];
  const photo=ph.length?`<figure class="dtl-photo">
      <button class="photowrap" data-gal="${i.id}" aria-label="See all photos">
        <img src="${esc(ph[0][0])}" alt="">
        ${ph.length>1?`<span class="photocount">${ph.length} photos</span>`:''}
      </button>
      <figcaption>${esc(ph[0][1])} · ${esc(ph[0][2])}</figcaption>
    </figure>`:'';
  openSheet(`
    ${photo}
    <h3>${esc(i.title)}</h3>
    <div class="meta" style="margin:-6px 0 14px">
      <span class="pill cat" style="--catbg:${c.bg};--catfg:${c.fg}">${c.label}</span>
      ${i.book?'<span class="pill book">book ahead</span>':''}
      ${i.must?'<span class="pill">★ Must do</span>':''}
      ${i.day?`<span class="pill">${DAYS.find(d=>d.id===i.day).label}</span>`:''}
    </div>
    ${i.note?`<div class="dtl-note">${esc(i.note)}</div>`:''}
    ${where}
    <div class="linkgrid">
      ${links}
      ${i.url&&!(i.links||[]).some(l=>l[1]===i.url)?`<a class="wide" href="${esc(i.url)}" ${LT}>Official page</a>`:''}
      ${!where?`<a class="${ph.length?'':'wide'}" href="${maps}" ${LT}>Maps</a>`:''}
      ${ph.length?`<button class="${where?'wide':''}" data-gal="${i.id}">Photos</button>`:''}
    </div>
    <label>Which day?</label>
    <div class="seg" id="dayseg">
      <button data-d="" aria-pressed="${!i.day}">—</button>
      ${DAYS.map(d=>`<button data-d="${d.id}" aria-pressed="${i.day===d.id}">${d.label.slice(0,3)} ${d.label.split(' ')[1]}</button>`).join('')}
    </div>
    <div class="actions">
      <button class="btn primary" data-edit="${i.id}">Edit</button>
      <button class="btn ghost" data-done="${i.id}">${i.done?'Untick':'Tick off'}</button>
    </div>`);
  el('#dayseg').onclick=e=>{
    const b=e.target.closest('button'); if(!b)return;
    i.day=b.dataset.d||null; save(); detail(id); render();
  };
}
function gallery(id){
  const i=S.items.find(x=>x.id===id); if(!i)return;
  const ph=PHOTOS[id]||[]; if(!ph.length)return detail(id);
  openSheet(`
    <h3>${esc(i.title)}</h3>
    <p class="galsub">${ph.length} photo${ph.length===1?'':'s'} from Wikimedia Commons</p>
    ${ph.map(p=>`<figure class="galshot">
        <img src="${esc(p[0])}" alt="" loading="lazy" decoding="async">
        <figcaption>${esc(p[1])} · ${esc(p[2])}</figcaption>
      </figure>`).join('')}
    <div class="actions"><button class="btn primary" data-open="${i.id}">Back</button></div>`);
}
function editor(id){
  const i=id?S.items.find(x=>x.id===id):{cat:'walk',must:0};
  openSheet(`
    <h3>${id?'Edit':'Add an idea'}</h3>
    <label for="f-t">Name</label>
    <input class="field" id="f-t" value="${esc(i.title)}" placeholder="e.g. Sunrise at Point Perry">
    <label>Category</label>
    <div class="seg" id="f-c">
      ${ORDER.map(k=>`<button data-k="${k}" aria-pressed="${i.cat===k}">${CATS[k].label}</button>`).join('')}
    </div>
    <label for="f-n">Notes</label>
    <textarea class="field" id="f-n" placeholder="Why you want to go, what to order, best time of day…">${esc(i.note)}</textarea>
    <label for="f-p">Place to search in Maps and photos</label>
    <input class="field" id="f-p" value="${esc(i.place)}" placeholder="e.g. Tickle Park Coolum Beach">
    <label for="f-u">Link</label>
    <input class="field" id="f-u" type="url" inputmode="url" value="${esc(i.url)}" placeholder="https://">
    <button class="starbtn" id="f-m" aria-pressed="${i.must?'true':'false'}">★ Must do</button>
    <button class="starbtn" id="f-b" aria-pressed="${i.book?'true':'false'}">Needs booking</button>
    <div class="actions">
      <button class="btn primary" id="f-save">${id?'Save changes':'Add it'}</button>
      ${id?`<button class="btn danger" id="f-del" aria-label="Delete">🗑</button>`:''}
      <button class="btn ghost" id="f-x">Cancel</button>
    </div>`);
  let c=i.cat||'walk', must=!!i.must, book=!!i.book;
  el('#f-c').onclick=e=>{const b=e.target.closest('button');if(!b)return;c=b.dataset.k;
    [...el('#f-c').children].forEach(x=>x.setAttribute('aria-pressed',x===b));};
  el('#f-m').onclick=e=>{must=!must;e.currentTarget.setAttribute('aria-pressed',must);};
  el('#f-b').onclick=e=>{book=!book;e.currentTarget.setAttribute('aria-pressed',book);};
  el('#f-x').onclick=closeSheet;
  if(id)el('#f-del').onclick=()=>{
    if(!confirm('Delete "'+i.title+'"?'))return;
    S.items=S.items.filter(x=>x.id!==id);save();closeSheet();renderChips();render();toast('Deleted');
  };
  el('#f-save').onclick=()=>{
    const t=el('#f-t').value.trim(); if(!t){el('#f-t').focus();return;}
    const d={title:t,cat:c,note:el('#f-n').value.trim(),place:el('#f-p').value.trim(),url:el('#f-u').value.trim(),must:must?1:0,book:book?1:0};
    if(id)Object.assign(i,d); else S.items.unshift({id:uid(),day:null,done:0,...d});
    save();closeSheet();renderChips();render();toast(id?'Saved':'Added');
  };
  setTimeout(()=>{if(!id)el('#f-t').focus();},280);
}
el('#scrim').onclick=closeSheet;
el('#add').onclick=()=>editor(null);
el('#tab-ideas').onclick=()=>{view='ideas';el('#tab-ideas').setAttribute('aria-selected','true');el('#tab-days').setAttribute('aria-selected','false');render();};
el('#tab-days').onclick=()=>{view='days';el('#tab-days').setAttribute('aria-selected','true');el('#tab-ideas').setAttribute('aria-selected','false');render();};
el('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;renderChips();render();};
el('#q').oninput=e=>{query=e.target.value.trim().toLowerCase();el('#qclear').hidden=!query;render();};
el('#qclear').onclick=()=>{el('#q').value='';query='';el('#qclear').hidden=true;render();};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tick]');
  if(t){const i=S.items.find(x=>x.id===t.dataset.tick);i.done=i.done?0:1;save();render();return;}
  const o=e.target.closest('[data-open]');
  if(o){o.dataset.open==='new'?editor(null):detail(o.dataset.open);return;}
  const g=e.target.closest('[data-gal]'); if(g){gallery(g.dataset.gal);return;}
  const ed=e.target.closest('[data-edit]'); if(ed){editor(ed.dataset.edit);return;}
  const dn=e.target.closest('[data-done]');
  if(dn){const i=S.items.find(x=>x.id===dn.dataset.done);i.done=i.done?0:1;save();closeSheet();render();}
});
el('#export').onclick=()=>{
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='coolum-backup.json';a.click();
};
el('#import').onclick=()=>{
  const f=document.createElement('input');f.type='file';f.accept='.json';
  f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
    if(d&&Array.isArray(d.items)){S=d;save();renderChips();render();toast('Restored');}}catch(e){toast('That file would not open');}};
    r.readAsText(f.files[0]);};
  f.click();
};
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    let had=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(had)toast('Updated \u2014 reopen for the newest version');
      had=true;
    });
  });
}
boot();
</script>
</body>
</html>
